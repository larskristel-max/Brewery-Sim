name: Validate Old Stables

on:
  pull_request:
    paths:
      - ".github/workflows/old-stables-validation.yml"
      - "godot/**"
      - "tools/validate_scenario.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/old-stables-validation.yml"
      - "godot/**"
      - "tools/validate_scenario.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: old-stables-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Scenario and headless gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.7.1-stable
      GODOT_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned Godot
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/godot.zip"
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl --fail --location --retry 3 --output "${archive}" "${url}"
          echo "${GODOT_SHA256}  ${archive}" | sha256sum --check -
          unzip -q "${archive}" -d "${RUNNER_TEMP}/godot"
          sudo install -m 0755 \
            "${RUNNER_TEMP}/godot/Godot_v${GODOT_VERSION}_linux.x86_64" \
            /usr/local/bin/godot
          godot --version

      - name: Validate sanitized scenario data
        run: python tools/validate_scenario.py godot/data/imported_scenario

      - name: Import Godot project
        run: godot --headless --editor --path godot --quit

      - name: Run Godot model tests
        run: godot --headless --path godot --script res://tests/run.gd

      - name: Run Godot UI interaction test
        run: godot --headless --path godot --script res://tests/ui_interaction_test.gd

      - name: Run responsive phone UI test
        run: godot --headless --path godot --script res://tests/responsive_ui_test.gd

      - name: Verify prologue speaker framing
        run: godot --headless --path godot --script res://tests/prologue_framing_test.gd

      - name: Verify world hotspot layout
        run: godot --headless --path godot --script res://tests/world_layout_test.gd

      - name: Verify truthful worker presentation
        run: godot --headless --path godot --script res://tests/worker_presentation_test.gd
